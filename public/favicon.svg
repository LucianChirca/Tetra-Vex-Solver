<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="round"><rect width="100" height="100" rx="22" /></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="100" height="100" fill="#0a0a0a" />
    <g stroke="#0a0a0a" stroke-width="6" stroke-linejoin="round">
      <polygon points="0,0 100,0 50,50" fill="#d22f2f" />
      <polygon points="100,0 100,100 50,50" fill="#1976d1" />
      <polygon points="100,100 0,100 50,50" fill="#388e3c" />
      <polygon points="0,100 0,0 50,50" fill="#fbc02d" />
    </g>
  </g>
</svg>
